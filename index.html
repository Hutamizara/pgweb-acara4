<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LeafletJS</title>

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />

    <style>
        html,
        body,
        #map {
            height: 100%;
            margin: 0;
        }
    </style>
</head>

<body>

    <div id="map"></div>

    <!-- Leaflet JavaScript -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin="">
    </script>

    <script>
        // Initialize the map
        var map = L.map('map').setView([-7.7272336, 109.0095601], 13);

        // Tile Layer Base Map
        var osm = L.tileLayer(
            "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
            {
                attribution:
                    '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
            }
        );

        var Esri_WorldImagery = L.tileLayer(
            'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
            {
                attribution:
                    'Tiles &copy; Esri &mdash; Source: Esri, i-cubed, USDA, USGS, AEX, GeoEye, Getmapping, Aerogrid, IGN, IGP, UPR-EGP, and the GIS User Community'
            }
        );

        var rupabumiindonesia = L.tileLayer(
            'https://geoservices.big.go.id/rbi/rest/services/BASEMAP/Rupabumi_Indonesia/MapServer/tile/{z}/{y}/{x}',
            {
                attribution: 'Badan Informasi Geospasial'
            }
        );

        var OpenStreetMap_Mapnik = L.tileLayer(
            'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
            {
                maxZoom: 19,
                attribution:
                    '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
            }
        );

        var OpenTopoMap = L.tileLayer(
            'https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png',
            {
                maxZoom: 17,
                attribution:
                    'Map data: &copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors, <a href="http://viewfinderpanoramas.org">SRTM</a> | Map style: &copy; <a href="https://opentopomap.org">OpenTopoMap</a> (<a href="https://creativecommons.org/licenses/by-sa/3.0/">CC-BY-SA</a>)'
            }
        );

        // Menambahkan basemap ke dalam peta
        OpenTopoMap.addTo(map);

        // Marker
        var marker = L.marker([-7.7272336, 109.0095601]);
        var marker2 = L.marker([-7.7319504, 108.9165017]);

        // Menambahkan marker ke dalam peta
        marker.addTo(map);
        marker2.addTo(map);

        // Popup
        marker.bindPopup(
            "<b>Hallo</b><br>" +
            "Cilacap adalah kabupaten terluas di Provinsi Jawa Tengah " +
            "yang terletak di pesisir selatan Pulau Jawa dan berbatasan " +
            "langsung dengan Provinsi Jawa Barat."
        );

        marker.openPopup();

        marker2.bindPopup(
            "<b>Hallo</b><br>" +
            "Kampung Laut adalah salah satu kecamatan di Kabupaten Cilacap, Provinsi Jawa Tengah, Indonesia. Kecamatan ini terletak di pesisir selatan Pulau Jawa dan berbatasan langsung dengan Samudra Hindia."
        );




        // Tooltip 
        marker.bindTooltip("Ini alun-alun Cilacap");
        marker.openTooltip();
        marker2.bindTooltip("Ini Kampung Laut");
        marker2.openTooltip();

        // Circle
        var circle = L.circle([-7.6431948, 109.0343821], {
            color: "red", // warna garis
            opacity: 1, // opacity garis
            fillColor: "#f03", // warna fill
            fillOpacity: 0.5, // opacity fill
            radius: 500 // radius dalam meter
        });

        //popup circle
        circle.bindPopup(
            "<b>Hallo</b><br>" +
            "Ini adalah Bandar Udara Tunggul Wulung Cilacap, yang terletak di Kecamatan Jeruklegi, Kabupaten Cilacap, Provinsi Jawa Tengah, Indonesia."
        );

        //tooltip circle
        circle.bindTooltip("Ini adalah area Bandar Udara Tunggul Wulung Cilacap");

        // Menambahkan circle ke dalam peta
        circle.addTo(map);

        // Polyline
        var vertexPolyline = [
            [-7.7033286, 109.0221405],
            [-7.6834141, 109.0473747],
            [-7.6652008, 109.0784454],
        ];
        var polyline = L.polyline(vertexPolyline, {
            color: "red", // warna garis
            weight: 3, // ketebalan garis
            opacity: 1, // opacity garis
        });

        // Menambahkan polyline ke dalam peta
        polyline.addTo(map);

        // Popup
        polyline.bindPopup("<b>Hallo</b><br>Ini adalah jalur polyline");
        polyline.openPopup();

        // Tooltip
        polyline.bindTooltip("Ini adalah polyline");
        polyline.openTooltip();

        // Polygon
        var vertexPolygon = [
            [-7.6960189, 109.0055323],
            [-7.7070320, 109.0051460],
            [-7.7058908, 108.9927435],
            [-7.6902743, 108.9983225],

        ];
        var polygon = L.polygon(vertexPolygon, {
            color: "purple", // warna garis
            weight: 3, // ketebalan garis
            opacity: 1, // opacity garis
            fillColor: "#0f3", // warna fill
            fillOpacity: 0.5, // opacity fill
        });

        // Popup
        polygon.bindPopup("<b>Hallo</b><br>Pertamina Cilacap atau PT Kilang Pertamina Internasional Refinery Unit IV Cilacap adalah kompleks kilang minyak terbesar di Indonesia yang berlokasi di Kabupaten Cilacap, Jawa Tengah.");
        polygon.openPopup();

        // Tooltip
        polygon.bindTooltip("Ini adalah area Pertamina Cilacap");

        // Scale
        var scale = L.control.scale();
        scale.addTo(map);

        var scale = L.control.scale({
            position: "bottomright",
        });

        var scale = L.control.scale({
            imperial: false,
        });

        // Menambahkan polygon ke dalam peta
        polygon.addTo(map);

        // Control Layer
        var baseMaps = {
            "OpenStreetMap": osm,
            "Esri World Imagery": Esri_WorldImagery,
            "Rupa Bumi Indonesia": rupabumiindonesia,
            "OpenStreetMap Mapnik": OpenStreetMap_Mapnik,
            "OpenTopoMap": OpenTopoMap,
        };

        var overlayMaps = {
            "Marker": marker,
            "Marker2": marker2,
            "Circle": circle,
        };

        var controllayer = L.control.layers(
            baseMaps,
            overlayMaps,
            {
                collapsed: false
            }
        );

        controllayer.addTo(map);
    </script>

</body>

</html>
